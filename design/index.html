<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Morris Interactive | Secure SIN Collection Portal — Design review</title>
<style>
:root{--murrey:#931b50;--dark-murrey:#5c0f33;--blue:#2978ab;--dark-blue:#144766;--teal:#1c6663;--light-teal:#edf5f5;--light-murrey:#f0e3e8;--ink:#181818;--muted:#595959;--line:#d7dcdc}*{box-sizing:border-box}body{margin:0;background:#f4f6f6;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input,textarea{font:inherit}a{color:var(--dark-blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.skip{position:absolute;left:16px;top:-100px;background:white;padding:12px;z-index:5}.skip:focus{top:8px}.review{background:var(--light-murrey);color:var(--dark-murrey);padding:10px 24px;font-size:13px;text-align:center;border-bottom:1px solid #ddc6d0}.header{background:var(--ink);color:white;padding:24px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:20px;font-weight:650;letter-spacing:-.4px}.asset{font-size:11px;color:#c9c9c9;letter-spacing:.04em;margin-top:3px}.portal{font-size:14px;color:#e4e4e4;border-left:1px solid #666;padding-left:24px}.reviewbar{padding:18px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border-bottom:1px solid var(--line)}.reviewbar label{font-size:13px;font-weight:650}.reviewbar select{min-height:44px;max-width:100%;padding:8px 36px 8px 12px;border:1px solid #959f9f;border-radius:8px;background:white;color:var(--ink)}.reviewtag{font-size:13px;color:var(--muted)}main{max-width:1240px;margin:auto;padding:40px 24px 72px}.layout{max-width:560px;margin:0 auto}.topline{display:flex;align-items:center;gap:10px;color:var(--teal);font-size:13px;font-weight:650;margin-bottom:20px}.lock{height:30px;width:30px;border:1px solid #bdcece;border-radius:8px;display:grid;place-items:center}.steps{display:flex;gap:16px;list-style:none;margin:0 0 22px;padding:0;font-size:13px;color:var(--muted);flex-wrap:wrap}.steps li{border-top:2px solid #d3dada;padding-top:10px;flex:1;min-width:100px}.steps .active{color:var(--murrey);border-color:var(--murrey);font-weight:650}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(24px,4vw,40px)}h1{font-size:clamp(26px,3vw,34px);line-height:1.2;letter-spacing:-.7px;margin:0 0 16px;font-weight:650}h2{font-size:19px;line-height:1.3;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}p{margin:0 0 20px;color:var(--muted)}.eyebrow{font-size:12px;font-weight:650;color:var(--teal);letter-spacing:.06em;margin-bottom:12px}.identity{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:24px 0}.caption{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}.identity strong{font-weight:550;overflow-wrap:anywhere}.notice{background:var(--light-teal);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:18px;margin:22px 0;color:var(--teal);font-size:14px}.notice p{color:inherit;margin:8px 0 0}.notice a{color:inherit}label.field{display:block;font-size:14px;font-weight:650;margin:20px 0 8px}input,textarea{width:100%;min-height:48px;border:1px solid #8a9696;border-radius:8px;padding:12px;background:#f7f8f8;color:#505959}input:disabled,textarea:disabled{opacity:1;-webkit-text-fill-color:#505959}.inputrow{display:flex;gap:10px}.inputrow input{min-width:0}.hint{font-size:13px;margin:8px 0 20px}.button{min-height:46px;border-radius:8px;padding:10px 18px;border:1px solid transparent;background:var(--murrey);color:white;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:normal}.button:disabled{cursor:not-allowed;opacity:1}.secondary{background:white;color:var(--ink);border-color:#b0baba}.full{width:100%}.textbutton{border:0;background:none;color:var(--dark-blue);padding:12px 0;min-height:44px;text-decoration:underline}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions>*{flex:1}.smallnote{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.footer{text-align:center;font-size:12px;margin:26px 0;color:var(--muted)}.symbol{display:grid;place-items:center;width:48px;height:48px;border:1px solid #b5cdcd;border-radius:50%;color:var(--teal);margin-bottom:22px;font-size:23px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;border-bottom:1px solid var(--line);padding-bottom:12px}.nav button{padding:10px 14px;min-height:44px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);cursor:pointer}.nav button[aria-current=page]{background:white;border-color:var(--line);color:var(--murrey);font-weight:650}.pagehead{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:24px}.pagehead p{margin:0;max-width:640px}.pill{font-size:12px;display:inline-block;border:1px solid #bac6c6;border-radius:5px;padding:4px 9px;white-space:nowrap;color:#354444}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}.metric{border:1px solid var(--line);border-radius:14px;padding:20px;background:white}.metric span{font-size:13px;color:var(--muted)}.metric strong{font-size:32px;display:block;margin-top:6px;font-weight:600;line-height:1.2}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:24px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:750px;text-align:left}th{font-size:12px;color:var(--muted);font-weight:600;background:#f4f7f7}th,td{padding:16px 14px;border-bottom:1px solid #e3e7e7}td small{display:block;color:var(--muted)}.tableaction{color:var(--dark-blue);font-size:13px;border:0;background:none;text-decoration:underline;min-height:44px;padding:8px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px}.checkrow{display:flex;gap:12px;align-items:start;font-size:14px;margin:20px 0}.checkrow input{width:20px;min-height:20px;margin-top:2px;flex:none}.reveal{background:#f3f5f5;border:1px dashed #99aaaa;border-radius:10px;text-align:center;padding:22px;color:var(--muted);margin:20px 0;font-size:18px}.kv{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span{color:var(--muted)}.reviewonly{border-top:1px solid var(--line);padding-top:16px;font-size:12px;margin-top:24px;color:var(--muted)}@media(max-width:700px){.header{padding:20px;align-items:start;flex-direction:column;gap:12px}.portal{border-left:0;padding-left:0}.reviewbar{align-items:start;flex-direction:column;padding:16px 20px}.reviewbar select{width:100%}.reviewtag{display:none}main{padding:28px 16px 48px}.metrics{grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:16px}.twocol{grid-template-columns:1fr}.pagehead{flex-direction:column}.nav{gap:2px}.nav button{padding:8px 10px;font-size:13px}.steps{gap:10px}.steps li{min-width:80px}.card{padding:24px}.brand{font-size:19px}}@media print{.reveal{display:none}.reviewbar,.nav{display:none}}
</style></head><body><a class="skip" href="#main">Skip to screen layout</a><div class="review"><strong>Design review only.</strong> No real SIN entry, authentication, email delivery or storage.</div><header class="header"><div><div class="brand">Morris Interactive</div><div class="asset">Approved logo asset to be supplied · text label only</div></div><div class="portal">Secure SIN Collection Portal</div></header><div class="reviewbar"><label for="screen">Review a screen layout</label><select id="screen"></select><span class="reviewtag">Phase 1 / Named database review</span></div><main id="main" tabindex="-1"></main>
<script>
'use strict';
const screens=[['welcome','Contractor · Secure invitation'],['verify','Contractor · Email verification'],['submit','Contractor · SIN submission'],['review','Contractor · Review submission'],['complete','Contractor · Confirmation'],['invalid','Contractor · Invalid or expired invitation'],['completed','Contractor · Already completed'],['login','Administrator · Secure login'],['dashboard','Administrator · Dashboard'],['invitations','Administrator · Invitation management'],['submissions','Administrator · Submission status'],['retrieve','Administrator · Local handling limitations'],['dispose','Administrator · Disposal confirmation'],['audit','Administrator · Audit activity']];
const button=(label,secondary=false)=>`<button class="button ${secondary?'secondary':''}" disabled>${label}</button>`;
const identity='<div class="identity"><span class="caption">Approved contractor email · synthetic example</span><strong>contractor@example.com</strong></div>';
const notice='<div class="notice"><strong>Your privacy comes first</strong><p>The live portal will explain the approved tax-reporting purpose, authorized access, retention period and privacy contact before you enter your SIN. These details require MI approval.</p></div>';
const step=(n)=>`<ol class="steps" aria-label="Submission steps"><li class="${n===1?'active':''}">1. Verify email</li><li class="${n===2?'active':''}">2. Submit SIN</li><li class="${n===3?'active':''}">3. Complete</li></ol>`;
function contractor(content,n=1){return `<div class="layout"><div class="topline"><span class="lock" aria-hidden="true">◇</span> Private information · restricted access</div>${step(n)}<section class="card">${content}<div class="reviewonly">Layout preview. All operational controls are disabled.</div></section><div class="footer">Morris Interactive · Privacy contact pending approval</div></div>`}
const nav=(active)=>`<nav class="nav" aria-label="Admin layout previews">${[['dashboard','Overview'],['invitations','Invitations'],['submissions','Submissions'],['audit','Audit activity']].map(([id,name])=>`<button data-screen="${id}" ${active===id?'aria-current="page"':''}>${name}</button>`).join('')}</nav>`;
const head=(title,desc)=>`<div class="pagehead"><div><div class="eyebrow">Administration</div><h1>${title}</h1><p>${desc}</p></div><span class="pill">Synthetic data only</span></div>`;
const invitationTable=`<div class="tablewrap" role="region" aria-label="Synthetic invitation records" tabindex="0"><table><thead><tr><th scope="col">Contractor email</th><th scope="col">Invited</th><th scope="col">Expires</th><th scope="col">Status</th><th scope="col">Permitted action</th></tr></thead><tbody><tr><td>contractor@example.com</td><td>Nov 5, 2026</td><td>Nov 8, 2026</td><td><span class="pill">Submitted</span></td><td>View status</td></tr><tr><td>consultant@example.org</td><td>Nov 5, 2026</td><td>Nov 8, 2026</td><td><span class="pill">Pending</span></td><td>Revoke</td></tr><tr><td>specialist@example.net</td><td>Nov 1, 2026</td><td>Nov 4, 2026</td><td><span class="pill">Expired</span></td><td>Reissue</td></tr></tbody></table></div>`;
const views={
welcome:()=>contractor(`<div class="eyebrow">You're invited</div><h1>A secure way to share your information.</h1><p>Morris Interactive has invited you to provide information for an approved business purpose. Sign in with your approved email address and verify it before accessing your invitation.</p>${identity}<p class="hint">Your invitation instructions are sent manually through MI's existing email service. A link alone does not grant access.</p>${button('Continue to email sign-in')}<div class="notice">Existing Blaze project · cloud collection disabled. Never include your SIN or password in ordinary email.</div>`),
verify:()=>contractor(`<div class="eyebrow">Verify your email</div><h1>Check your inbox.</h1><p>After email/password sign-up, Firebase sends a verification link to your approved address.</p>${identity}<div class="notice">Open the verification link, then return here. Access requires a verified Firebase identity matching an active invitation.</div>${button("I've verified my email — check access")}<br><button class="textbutton" disabled>Resend verification email</button><p class="hint">Provider sending limits apply. This design uses verification links, not a custom numeric-code service.</p>`),
submit:()=>contractor(`<div class="eyebrow">Email verified · layout state</div><h1>Enter your SIN.</h1><p>You'll have a chance to review it before submitting.</p>${identity}<label class="field" for="sin">Social Insurance Number</label><div class="inputrow"><input id="sin" type="password" inputmode="numeric" autocomplete="off" placeholder="Entry disabled in design preview" disabled aria-describedby="sinhint"><button class="button secondary" disabled aria-pressed="false">Show</button></div><p class="hint" id="sinhint">Nine digits. Spaces and hyphens are accepted in the live form.</p>${notice}<p class="hint">Have a business number, or unsure this request applies? Contact MI before submitting.</p>${button('Review information')}`,2),
review:()=>contractor(`<div class="eyebrow">Review before submitting</div><h1>Ready to submit?</h1><p>Check your number carefully. After submission, you won't be able to view or change it in this portal.</p>${identity}<div class="reveal">SIN review placeholder<br><small>No SIN is present in this prototype</small></div><label class="checkrow"><input type="checkbox" disabled><span>I have checked my information and read the privacy notice.</span></label><div class="actions">${button('Go back and correct',true)}${button('Submit securely')}</div>`,2),
complete:()=>contractor(`<div class="symbol" aria-hidden="true">✓</div><h1>Your information has been submitted securely.</h1><p>No further action is required unless Morris Interactive contacts you.</p><div class="notice">Your SIN will not be shown here or included in a confirmation email.</div><p class="hint">You may close this window.</p>`,3),
invalid:()=>contractor(`<div class="symbol" aria-hidden="true">—</div><h1>This invitation is unavailable.</h1><p>The link may be expired, invalid or revoked.</p><div class="notice">Please contact your Morris Interactive representative through your existing business contact to request assistance. Do not email your SIN.</div>`),
completed:()=>contractor(`<div class="symbol" aria-hidden="true">✓</div><h1>This submission is complete.</h1><p>This invitation can no longer be used. Your information cannot be viewed or changed here.</p><div class="notice">If you need to correct information, contact your Morris Interactive representative without including your SIN.</div>`,3),
login:()=>contractor(`<div class="eyebrow">MI administrators</div><h1>Sign in securely.</h1><p>Use your assigned Firebase account. Existing users of another application do not automatically have portal access.</p><label class="field" for="adminemail">Approved email address</label><input id="adminemail" type="email" autocomplete="username" placeholder="Email entry disabled in design preview" disabled><label class="field" for="adminpassword">Password</label><input id="adminpassword" type="password" autocomplete="current-password" placeholder="Password entry disabled" disabled>${button('Sign in')}<div class="notice">Portal roles are assigned separately. Fresh MFA has not been demonstrated; real ciphertext access remains disabled.</div><p class="hint">Email/password reauthentication alone is not MFA.</p>`),
dashboard:()=>nav('dashboard')+head('Collection overview','Manage invitations and follow each record through secure transfer and removal.')+`<div class="metrics">${[['Invitations sent','24'],['Pending invitations','8'],['Successfully submitted','12'],['Expired or revoked','4'],['Awaiting handling','5'],['Transferred and removed','7']].map(([l,v])=>`<div class="metric"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h2>Recent invitation activity</h2><p class="hint">Illustrative subset. Lists contain status information only.</p>${invitationTable}</div><div class="notice">Ciphertext access requires a separate role and record assignment. Real access remains disabled. No SINs or last-four digits appear on this dashboard.</div>`,
invitations:()=>nav('invitations')+head('Contractor invitations','Invite approved recipients after Finance confirms the collection purpose.')+`<div class="panel"><h2>Add approved email addresses</h2><div class="twocol"><div><label class="field" for="emails">One email address per line</label><textarea id="emails" rows="3" placeholder="Example recipients only · entry disabled" disabled></textarea><p class="hint">The proposed portal validates a bounded list. Staff send individual instructions manually using existing corporate email.</p></div><div><label class="field" for="purpose">Approved collection purpose</label><input id="purpose" value="Tax-reporting purpose — awaiting approval" disabled><label class="field" for="ttl">Invitation expiry</label><input id="ttl" value="72 hours · proposed policy" disabled></div></div>${button('Review and save approved invitations')}</div><div class="panel"><h2>Invitation management</h2>${invitationTable}</div>`,
submissions:()=>nav('submissions')+head('Submission status','Track handling and active deletion using non-sensitive metadata only.')+`<div class="panel"><div class="tablewrap" role="region" aria-label="Synthetic submission statuses" tabindex="0"><table><thead><tr><th>Reference</th><th>Received</th><th>Status</th><th>Retention deadline</th><th>Permitted action</th></tr></thead><tbody><tr><td>MI-DEMO-A</td><td>Nov 5, 2026</td><td>Awaiting handling</td><td>Nov 12, 2026</td><td>Review handling assignment</td></tr><tr><td>MI-DEMO-B</td><td>Nov 4, 2026</td><td>Handling claimed</td><td>Nov 11, 2026</td><td>Confirm transfer</td></tr><tr><td>MI-DEMO-C</td><td>Nov 3, 2026</td><td>Recovery required</td><td>Nov 10, 2026</td><td>Follow recovery process</td></tr><tr><td>MI-DEMO-D</td><td>Nov 2, 2026</td><td>Disposed</td><td>Completed</td><td>View metadata</td></tr></tbody></table></div></div><div class="notice">Reference labels are illustrative. Production references will be random and contain no SIN-derived information.</div>`,
retrieve:()=>nav('submissions')+head('Restricted local handling','Design review only. Real ciphertext access and local decryption are disabled.')+`<div class="twocol"><section class="panel"><h2>Record MI-DEMO-A</h2><div class="kv"><span>Required role</span><strong>Assigned custodian</strong></div><div class="kv"><span>Fresh MFA</span><strong>Not demonstrated</strong></div><div class="kv"><span>One-time decryption</span><strong>Cannot be guaranteed</strong></div><div class="notice">Firestore Rules can limit who reads ciphertext. They cannot consume a read or revoke ciphertext already retained. A handling claim is only a status change.</div>${button('Claim handling · synthetic only')}<label class="checkrow"><input type="checkbox" disabled><span>I have reviewed the access, custody and transfer limitations.</span></label></section><section class="panel"><h2>Separate offline utility</h2><div class="reveal">No SIN or private key present<br><small>Hosted key import is not provided</small></div><p class="hint">Private keys stay outside Firebase and this hosted application. A separate reviewed offline process would import a key temporarily.</p><p class="hint">Single-record ciphertext handoff remains unresolved. No download or export feature is added.</p><p class="hint">A brief local display cannot prevent screenshots, extensions or repeated offline decryption.</p></section></div>`,
dispose:()=>nav('submissions')+head('Confirm transfer and active removal','An authorized officer attests transfer before removing the active portal payload.')+`<section class="panel" style="max-width:720px"><h2>Record MI-DEMO-B</h2><label class="field" for="destination">Approved business record</label><input id="destination" value="Destination system — pending MI approval" disabled><label class="checkrow"><input type="checkbox" disabled><span>I confirm that this record has been transferred into the approved secure business record.</span></label><div class="notice">A paired delete/status update can remove the active Firestore payload. It cannot erase previously retained ciphertext or private keys. Automatic deadline deletion is not available in this design.</div>${button('Attest transfer and remove active payload')}<div class="kv"><span>Active payload deletion</span><strong>Not initiated</strong></div><div class="kv"><span>Offline key/copy handling</span><strong>Separate approved process</strong></div><p class="hint">Official business records follow a separate retention policy. No immediate backup-erasure claim is made.</p></section>`,
audit:()=>nav('audit')+head('Audit activity','Restricted state-change events only. Reads and offline decryption are not automatically audited.')+`<div class="panel"><div class="tablewrap" role="region" aria-label="Synthetic audit events" tabindex="0"><table><thead><tr><th>Time · UTC</th><th>Actor</th><th>Event</th><th>Reference</th><th>Outcome</th></tr></thead><tbody><tr><td>Nov 5, 14:10</td><td>InvitationAdmin · demo</td><td>Invitation created</td><td>MI-DEMO-A</td><td>Completed</td></tr><tr><td>Nov 5, 14:16</td><td>Contractor session</td><td>Submission accepted</td><td>MI-DEMO-A</td><td>Completed</td></tr><tr><td>Nov 5, 14:20</td><td>CiphertextCustodian · demo</td><td>Handling claim recorded</td><td>MI-DEMO-B</td><td>Claimed</td></tr><tr><td>Nov 5, 14:30</td><td>DisposalOfficer · demo</td><td>Active payload removed</td><td>MI-DEMO-D</td><td>Completed</td></tr></tbody></table></div></div>`
};
const selector=document.getElementById('screen');for(const [id,label] of screens){const o=document.createElement('option');o.value=id;o.textContent=label;selector.append(o)}
function render(id){document.getElementById('main').innerHTML=views[id]();selector.value=id;document.title=`${screens.find(s=>s[0]===id)[1]} | MI design review`;document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>{render(b.dataset.screen);document.getElementById('main').focus()}))}
selector.addEventListener('change',()=>render(selector.value));render('welcome');
</script></body></html>
