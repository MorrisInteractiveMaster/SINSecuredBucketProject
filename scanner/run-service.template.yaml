# Operator renders IMAGE_DIGEST, RUNTIME_SUBJECT, FILES_KEY, SCANNER_ORIGIN.
# Never use this template to replace another service. IAM is applied separately.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mi-secure-pdf-scanner
  labels:
    cloud.googleapis.com/location: northamerica-northeast1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'false'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: mi-bucket-scanner@gen-lang-client-0948635471.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 60
      containers:
        - image: IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
          env:
            - name: PORTAL_RUNTIME_SUBJECT
              value: RUNTIME_SUBJECT
            - name: FILES_KMS_KEY
              value: FILES_KEY
            - name: SCANNER_AUDIENCE
              value: SCANNER_ORIGIN
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 24
