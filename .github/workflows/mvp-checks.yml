name: Portal checks (Node 22)
on:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python3 scripts/check_phase1.py
      - run: npm run test:all
      - run: npm run check:cloud
      - run: npm run prepare:cloud
      - run: npm ci --ignore-scripts --prefix .deploy/functions
      - run: node scripts/verify-cloud-package.mjs
      - run: npm audit --prefix cloud-functions --audit-level=high
      - run: npm audit --audit-level=high
# No secrets, cloud login, resource creation or deployment permissions/steps.
