name: Local MVP checks
on:
  pull_request:
  push:
    branches: [phase-1/architecture-design]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python3 scripts/check_phase1.py
      - run: npm run test:mvp:local-http
      - run: npm audit --audit-level=high
# No secrets, cloud login, resource creation or deployment permissions/steps.
